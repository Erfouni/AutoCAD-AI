name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # windows-latest because config and tools deal in Windows paths, and the
    # server imports pywin32. No AutoCAD is needed -- nothing here talks COM.
    runs-on: windows-latest
    env:
      # Without this the config import writes a .secret into the checkout.
      ACAD_MCP_SECRET_PATH: ci-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Byte-compile every module
        run: python -m compileall -q acad.py config.py server.py tools.py test_draw.py
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "::error file=$($_.Name)::$($errors -join '; ')"
              $failed = $true
            } else {
              Write-Host "ok: $($_.Name)"
            }
          }
          if ($failed) { exit 1 }
